name: Tests

on:
  push:
  pull_request:

# The workflow only reads the repository and runs tests; it never needs to write anything back.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        # ./server[test] brings mcp, pillow, pytest and lupa (lupa runs the plug-in's Lua tests; without it they are skipped).
        # pywebview is the only extra package the desktop app's tests import (app/main.py).
        run: python -m pip install -e "./server[test]" pywebview
      - name: Test MCP server
        working-directory: server
        # -rs lists skipped tests, so a missing lupa (skipped Lua tests) shows up in the log
        run: python -m pytest -q -rs
      - name: Check Lua syntax
        run: python server/tests/lua_syntax.py
      - name: Test desktop application
        run: python -m pytest app/tests -q -rs
