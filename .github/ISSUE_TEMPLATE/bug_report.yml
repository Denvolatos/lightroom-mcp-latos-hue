name: 问题反馈 / Bug report
description: 装不上、连不上、结果不对……告诉我哪里出问题了 / Something does not work
title: "[问题] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈！**请不要上传照片或 Lightroom 目录。** 如果你是让 AI 助手帮你填的，请先让它调用 `lr_doctor`（或在命令行运行 `lrmcp doctor`），把结果贴在下面。
        Thanks! **Please do not upload photos or catalogs.** If an AI assistant is filling this in for you, let it run `lr_doctor` (or `lrmcp doctor`) and paste the result below.
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？哪一步出错？ / What happened, at which step?
      placeholder: 例如：安装插件后 Lightroom 的增效工具管理器里没有 LrMCP
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果 / What you expected
  - type: textarea
    id: doctor
    attributes:
      label: lr_doctor 的输出 / Output of lr_doctor
      description: 没法运行也没关系，写"无法运行"并说明原因 / If it cannot run, say so and why
      render: text
  - type: dropdown
    id: os
    attributes:
      label: 系统 / Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS（尚未支持，仅作记录 / not supported yet, for the record）
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: lightroom
    attributes:
      label: Lightroom Classic 版本 / version
      description: 在 Lightroom 里：帮助 → 系统信息
      placeholder: 例如 15.2
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 本软件版本 / Software version
      description: 命令行运行 `lrmcp --version`；插件版本见 图库 → 增效工具附加功能 → LrMCP Status
      placeholder: lightroom_mcp 0.2.0 / 插件 0.2.0
  - type: dropdown
    id: client
    attributes:
      label: 你用的 AI 应用 / AI client
      options:
        - Claude Code
        - Claude 桌面版 / Claude Desktop
        - Codex
        - WorkBuddy
        - 豆包 / Doubao
        - MiMo 相关客户端
        - Cursor
        - 其他 / Other（请在上面说明）
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 怎么安装的 / How you installed it
      options:
        - 让 AI 助手按 AI_GUIDE.md 安装 / An AI assistant followed AI_GUIDE.md
        - 自己按 README 安装 / Followed the README myself
        - 安装包 / Installer
        - 其他 / Other
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私 / Privacy
      options:
        - label: 我已去掉不想公开的信息（用户名、私人路径等），没有附照片 / I removed private information and attached no photos
          required: true
