<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>修图助手</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #17181b; --panel: #1f2125; --panel2: #25282d; --line: #31353b;
    --text: #e6e8eb; --muted: #8b929b; --accent: #4c9aff; --accent2: #2d6fd6;
    --ok: #3ecf8e; --warn: #f5a524; --bad: #f31260;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* ---------- top bar ---------- */
  .topbar { height: 48px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; margin-right: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #3b2f12; color: var(--warn); }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 5px 14px; transition: background .15s, border-color .15s; }
  .btn:hover { background: #2d3138; border-color: #454b53; }
  .btn.primary { background: var(--accent2); border-color: var(--accent2); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); }
  .btn.small { padding: 2px 10px; font-size: 12px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .spacer { flex: 1; }
  .status { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .hint { color: var(--muted); font-size: 12px; max-width: 460px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ---------- three columns ---------- */
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 280px 1fr 360px; }
  .col { min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
  .col.left { border-right: 1px solid var(--line); }
  .col.right { border-left: 1px solid var(--line); }
  .tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); flex: none; }
  .tab { padding: 6px 12px; border: none; background: none; color: var(--muted);
    border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .pane { overflow: auto; padding: 10px; min-height: 0; }
  .list-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
    border: 1px solid transparent; cursor: pointer; }
  .list-item:hover { background: var(--panel2); }
  .list-item .name { flex: 1; }
  .list-item .tag { font-size: 11px; color: var(--muted); }
  .star { color: var(--muted); cursor: pointer; }
  .star.on { color: var(--warn); }
  .empty { color: var(--muted); font-size: 12px; padding: 4px 8px; }
  /* left: upper tabs area ~1/3, files ~2/3 */
  .left .upper { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .left .lower { flex: 2; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .section-title { padding: 8px 12px; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; flex: none; }
  .folder { padding: 4px 8px; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .thumb { width: 44px; height: 32px; border-radius: 4px; flex: none; }
  /* ---------- center ---------- */
  .center { background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .viewbar { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg button { border: none; background: var(--panel2); padding: 4px 14px; color: var(--muted); }
  .seg button.on { background: var(--accent2); color: #fff; }
  .stage { flex: 1; min-height: 0; display: grid; gap: 10px; padding: 12px 12px 6px; grid-template-rows: minmax(0, 1fr); }
  .stage.pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .frame { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line);
    min-height: 0; min-width: 0; background: #0f1012; }
  .frame .scroller { position: absolute; inset: 0; display: flex; overflow: hidden; }
  .frame .pimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  .frame.has .pimg { display: block; }
  .stage.actual .scroller { overflow: auto; }
  .stage.actual .pimg { position: static; width: auto; height: auto; max-width: none; margin: auto; flex: none; }
  .frame .label { position: absolute; left: 10px; top: 10px; padding: 2px 10px; border-radius: 99px;
    background: rgba(0,0,0,.6); font-size: 12px; z-index: 2; }
  .frame .note { position: absolute; left: 10px; bottom: 10px; right: 10px; font-size: 12px; color: #dfe3e8;
    text-shadow: 0 1px 2px #000; z-index: 2; pointer-events: none; }
  .frame .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 24px; color: var(--muted); font-size: 13px; z-index: 1; }
  .frame.has .ph { display: none; }
  .frame .chip { position: absolute; right: 10px; top: 10px; padding: 2px 10px; border-radius: 99px; z-index: 2;
    background: rgba(0,0,0,.6); font-size: 12px; color: var(--warn); display: none; }
  .frame.busy .chip { display: block; }
  .infobar { flex: none; padding: 2px 14px 10px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .infobar .line { color: var(--text); opacity: .85; font-variant-numeric: tabular-nums; user-select: text; }
  .seg button:disabled { opacity: .5; cursor: not-allowed; }
  .viewbar select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font: inherit; font-size: 12px; }
  /* 仅界面演示用（#demo）：示例画面，非真实照片 */
  .scene { position: absolute; inset: 0; background:
    radial-gradient(circle at 70% 22%, #f6d9a8 0 6%, transparent 7%),
    linear-gradient(180deg, #6f93b8 0%, #9db8cf 38%, #c9d3d6 52%, transparent 52%),
    linear-gradient(165deg, transparent 0 52%, #e9eef2 52% 60%, #8a95a0 60% 72%, #3d4a3a 72% 100%);
    background-color: #c9d3d6; transition: filter .4s ease; }
  .scene.after { filter: contrast(1.18) saturate(1.35) brightness(1.04); }
  /* ---------- right ---------- */
  .right .params { flex: 2; min-height: 0; display: flex; flex-direction: column; }
  .right .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 400; font-size: 12px; padding: 4px 6px; }
  td { padding: 5px 6px; border-top: 1px solid var(--line); }
  td.num { font-variant-numeric: tabular-nums; }
  .up { color: var(--ok); } .down { color: var(--warn); }
  .why { color: var(--muted); font-size: 12px; }
  .msgs { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .msg { padding: 6px 10px; border-radius: 10px; max-width: 92%; user-select: text; }
  .msg.me { align-self: flex-end; background: var(--accent2); }
  .msg.ai { align-self: flex-start; background: var(--panel2); white-space: pre-wrap; }
  .msg.err { align-self: flex-start; background: #4a2a2a; color: #ffd9d9; }
  .note { align-self: flex-start; font-size: 12px; color: var(--muted); padding: 0 10px; }
  .chatbar button:disabled { opacity: .45; cursor: not-allowed; }
  .ask { align-self: stretch; border: 1px solid var(--warn); border-radius: 10px; padding: 8px 10px; background: #2a2414; }
  .ask .row { display: flex; gap: 8px; margin-top: 6px; }
  .restore-row { margin-top: 10px; }
  .st-ok { color: var(--ok); } .st-bad { color: var(--bad); } .st-wait { color: var(--warn); } .st-mute { color: var(--muted); }
  .ask .items { margin: 4px 0; } .ask .items div { font-variant-numeric: tabular-nums; }
  .ask.done { border-color: var(--line); background: var(--panel2); }
  .dialog.small { width: 380px; } .dialog p { margin: 0; white-space: pre-wrap; }
  .chatbar { flex: none; display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
  .chatbar input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 6px 10px; font: inherit; outline: none; user-select: text; }
  .chatbar input:focus { border-color: var(--accent); }
  .opts { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 10px; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--line); }
  .switch { position: relative; width: 34px; height: 18px; border-radius: 99px; background: #444a52; border: none; padding: 0; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .2s; }
  .switch.on { background: var(--ok); } .switch.on::after { left: 18px; }
  /* ---------- export dialog ---------- */
  .mask { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; }
  .mask.show { display: flex; }
  .dialog { width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .dialog h3 { margin: 0 0 12px; }
  .field { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; margin: 8px 0; }
  .field select, .field input { background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; }
  .dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  /* ---------- export dialog (0.8.0) ---------- */
  .dialog.exp { width: 560px; max-width: calc(100vw - 40px); max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
  .dialog.exp .body { overflow: auto; margin: 0 -6px; padding: 0 6px; }
  .dialog.exp .row { flex: none; }
  .exp .erow { display: grid; grid-template-columns: 80px 1fr; gap: 4px 10px; align-items: center; margin: 9px 0; }
  .exp .erow > .lab { color: var(--text); }
  .exp .erow select, .exp .erow input[type=text], .exp .erow input[type=number] { background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .exp .erow input[type=text] { width: 100%; user-select: text; }
  .exp .inline { display: flex; gap: 8px; align-items: center; }
  .exp .inline input[type=text] { flex: 1; min-width: 0; }
  .exp .inline input[type=range] { flex: 1; }
  .exp input[type=number] { width: 100px; }
  .exp .sub { grid-column: 2; color: var(--muted); font-size: 12px; }
  .exp .warn { grid-column: 2; color: var(--warn); font-size: 12px; }
  .exp .warn:empty { display: none; }
  .exp .bad { color: var(--bad); font-size: 12px; margin: 6px 0; }
  .exp .bad:empty { display: none; }
  .exp .okmsg { color: var(--ok); }
  .exp .big { font-size: 15px; margin: 2px 0 10px; }
  .exp .kvl { display: grid; grid-template-columns: 80px 1fr; gap: 4px 10px; margin: 6px 0; font-size: 13px; user-select: text; }
  .exp .kvl > span:nth-child(odd) { color: var(--muted); } .exp .kvl > span:nth-child(even) { word-break: break-all; }
  .exp .mute { color: var(--muted); font-size: 12px; margin: 4px 0; }
  .exp .fname { font-family: Consolas, monospace; user-select: text; word-break: break-all; }
  .exp .sep { border-top: 1px solid var(--line); margin: 10px 0 2px; }
  .exp label.radio { margin-right: 14px; cursor: pointer; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    vertical-align: -2px; margin-right: 8px; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  /* ---------- settings dialog ---------- */
  .dialog.wide { width: 580px; max-width: calc(100vw - 40px); max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
  .dialog.wide .body { overflow: auto; margin: 0 -6px; padding: 0 6px; }
  .sgroup { border-top: 1px solid var(--line); padding: 12px 0 4px; }
  .sgroup:first-child { border-top: none; padding-top: 0; }
  .sgroup h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .srow { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: center; margin: 8px 0; }
  .srow > label, .srow > .lab { color: var(--text); }
  .srow input[type=text], .srow select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; }
  .srow .inline { display: flex; gap: 8px; align-items: center; }
  .srow .inline input { flex: 1; min-width: 0; user-select: text; }
  .sub { grid-column: 2; color: var(--muted); font-size: 12px; margin-top: -4px; }
  .sub.bad, .ferr { color: var(--bad); } .sub.ok { color: var(--ok); }
  .ferr { grid-column: 2; font-size: 12px; margin-top: -4px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 8px; margin: 4px 0 8px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--muted); } .kv span:nth-child(even) { user-select: text; word-break: break-all; }
  .sfoot { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .sfoot .msg-line { flex: 1; font-size: 12px; } .sfoot .msg-line.ok { color: var(--ok); } .sfoot .msg-line.bad { color: var(--bad); }
  /* ---------- import dialog / library ---------- */
  .dialog.imp { width: 600px; max-width: calc(100vw - 40px); max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
  .dialog.imp .body { overflow: auto; margin: 0 -6px; padding: 0 6px; user-select: text; }
  .dialog.imp .row { flex: none; }
  .imp .big { font-size: 15px; margin: 2px 0 10px; }
  .imp .kvl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px; margin: 6px 0; font-size: 13px; }
  .imp .kvl > span:nth-child(odd) { color: var(--muted); } .imp .kvl > span:nth-child(even) { word-break: break-all; }
  .imp .bad { color: var(--bad); font-size: 12px; margin: 4px 0; } .imp .okmsg { color: var(--ok); font-size: 12px; }
  .imp .warn { color: var(--warn); font-size: 12px; margin: 4px 0; } .imp .mute { color: var(--muted); font-size: 12px; margin: 4px 0; }
  .imp input[type=text] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .bar { height: 10px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; margin: 10px 0 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent2); transition: width .2s; }
  .imp table td, .imp table th { font-size: 12px; vertical-align: top; }
  .imp .plist { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; margin-top: 6px; }
  .libhead { display: flex; align-items: center; gap: 6px; padding: 6px 8px 2px; color: var(--muted); font-size: 12px; }
  .libgrp { padding: 3px 8px; cursor: pointer; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
  .libgrp:hover { background: var(--panel2); } .libgrp .cnt { color: var(--muted); font-size: 11px; margin-left: auto; }
  .libfile { padding: 2px 8px 2px 26px; font-size: 12px; cursor: pointer; border-radius: 6px; display: flex; gap: 8px; }
  .libfile:hover, .libfile.on { background: var(--panel2); } .libfile .sz { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .libinfo { margin: 6px 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--muted); user-select: text; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #3a3f46; border-radius: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">修图助手</span><span class="badge" id="demobadge">界面演示 · 示例数据</span>
  <button class="btn" id="impbtn" onclick="startImport()">导入</button>
  <button class="btn" onclick="openExport()">导出</button>
  <button class="btn" onclick="undo()">撤销</button>
  <button class="btn" id="newchat" onclick="newChat()" style="display:none">新对话</button>
  <span class="spacer"></span>
  <button class="btn" id="setbtn" style="display:none" onclick="openSettings()">设置</button>
  <span class="status"><span class="dot" id="lrdot"></span><span id="lrstat">Lightroom 已连接（示例）</span></span>
  <span class="hint" id="lrhint"></span>
  <span class="status" id="toastbox"></span>
</div>

<div class="main">
  <!-- LEFT -->
  <div class="col left">
    <div class="upper">
      <div class="tabs" id="ltabs">
        <button class="tab on" data-t="preset">预设</button>
        <button class="tab" data-t="fav">收藏</button>
        <button class="tab" data-t="exp">经验</button>
      </div>
      <div class="pane" id="lpane"></div>
    </div>
    <div class="lower">
      <div class="section-title">文件 <span class="spacer"></span>
        <button class="btn small" id="newcat" onclick="toast('新建分类：功能开发中')">新建分类</button></div>
      <div class="pane" id="files" style="flex:none;max-height:36%"></div>
      <div id="libwrap" style="display:none;flex:1;min-height:0;flex-direction:column;border-top:1px solid var(--line)">
        <div class="libhead"><span id="libtitle">软件文件夹</span><span class="spacer"></span>
          <button class="btn small" id="libref" title="重新读取软件文件夹">刷新</button>
          <button class="btn small" id="libopen" title="在资源管理器中打开软件文件夹">打开文件夹</button></div>
        <div class="pane" id="lib" style="flex:1"></div>
      </div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="viewbar">
      <div class="seg" id="modes"><button class="on" data-m="pair">并排</button><button data-m="multi" disabled title="需要版本功能，后续提供">多版本</button></div>
      <span class="why">多版本：需要版本功能，后续提供</span>
      <span class="spacer"></span>
      <span id="pvctl" style="display:none;align-items:center;gap:8px">
        <label class="why">预览清晰度 <select id="edge"><option value="768">长边 768 px</option><option value="1024" selected>长边 1024 px</option><option value="1536">长边 1536 px</option><option value="2048">长边 2048 px</option></select></label>
        <button class="btn small" id="zoom" title="双击画面也可切换">适合窗口</button>
      </span>
      <span class="why" id="cur"></span>
    </div>
    <div class="stage pair" id="stage"></div>
    <div class="infobar" id="infobar"></div>
  </div>

  <!-- RIGHT -->
  <div class="col right">
    <div class="params">
      <div class="section-title">本次调整</div>
      <div class="pane"><table id="ptable"><thead><tr><th>参数</th><th>改前</th><th>改后</th><th>状态</th><th></th></tr></thead><tbody></tbody></table>
        <div class="empty" id="pempty">暂无调整。请在下方输入修图需求。</div>
        <div class="restore-row" id="restorerow" style="display:none"><button class="btn small" onclick="restoreOriginal()">还原到原始状态</button></div></div>
    </div>
    <div class="chat">
      <div class="msgs" id="msgs"><div class="msg ai">请选择照片并输入期望的修图效果。</div></div>
      <div class="opts"><button class="switch on" id="sw" title="开启后，每项调整需先经确认才会执行"></button><span id="swlabel">逐项确认：开（每项调整需先确认）</span></div>
      <div class="chatbar"><input id="inp" placeholder="例如：提高天空通透度，增强整体层次感" autocomplete="off"><button class="btn primary" id="send">发送</button><button class="btn" id="stop" style="display:none">停止</button></div>
    </div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog exp" role="dialog" aria-label="导出照片">
    <h3>导出照片</h3>
    <div class="body" id="ex_body"></div>
    <div class="row" id="ex_foot"></div>
  </div>
</div>

<div class="mask" id="imask">
  <div class="dialog imp" role="dialog" aria-label="导入照片">
    <h3 id="im_title">导入照片</h3>
    <div class="body" id="im_body"></div>
    <div class="row" id="im_foot"></div>
  </div>
</div>

<div class="mask" id="smask">
  <div class="dialog wide" role="dialog" aria-label="设置">
    <h3>设置</h3>
    <div class="body">
      <div class="sgroup">
        <h4>常规</h4>
        <div class="srow"><span class="lab">软件文件夹</span>
          <span class="inline"><input type="text" id="s_folder" readonly><button class="btn small" id="s_pick">选择文件夹</button></span>
          <span class="sub">导入时，照片会复制到该文件夹，再加入 Lightroom 目录；原片不会被移动或删除。</span>
          <span class="ferr" id="e_folder"></span></div>
      </div>
      <div class="sgroup">
        <h4>AI 来源</h4>
        <div class="srow"><label for="s_provider">使用的来源</label><select id="s_provider"></select>
          <span class="sub" id="s_pstate"></span><span class="sub" id="s_pnote">切换来源后，下一次“新对话”生效。</span>
          <span class="ferr" id="e_provider"></span></div>
      </div>
      <div class="sgroup">
        <h4>对话</h4>
        <div class="srow"><span class="lab">逐项确认默认值</span>
          <span class="inline"><button class="switch on" id="s_confirm" aria-label="逐项确认默认值"></button><span id="s_confirm_t">开</span></span>
          <span class="sub">新对话开始时使用该默认值；对话中仍可随时切换。</span></div>
        <div class="srow"><label for="s_edge">预览默认清晰度</label><select id="s_edge"></select>
          <span class="ferr" id="e_edge"></span></div>
      </div>
      <div class="sgroup">
        <h4>关于</h4>
        <div class="kv">
          <span>软件版本</span><span id="a_app"></span>
          <span>Lightroom 版本</span><span id="a_lr"></span>
          <span>插件版本</span><span id="a_plugin"></span>
          <span>数据位置</span><span id="a_data"></span>
          <span>项目主页</span><span id="a_url"></span>
        </div>
      </div>
    </div>
    <div class="sfoot"><span class="msg-line" id="s_msg"></span>
      <button class="btn" id="s_cancel">取消</button><button class="btn primary" id="s_save">保存</button></div>
  </div>
</div>

<script>
const PHOTOS = [
  {n:'DSC08205.JPG', f:'雪山', c:'#6f93b8'}, {n:'DSC08206.JPG', f:'雪山', c:'#8aa5bd'},
  {n:'DSC08211.JPG', f:'雪山', c:'#5d7f9e'}, {n:'IMG_0412.JPG', f:'街拍', c:'#b08968'},
  {n:'IMG_0415.JPG', f:'街拍', c:'#9c7a5b'}, {n:'IMG_0420.JPG', f:'未分类', c:'#7a8f6a'}
];
const PRESETS = ['清爽风光', '电影感', '黑白高对比', '日系低饱和'];
const EXPERIENCE = ['天空发灰：先降低高光，再提高蓝色饱和度', '逆光人像：阴影 +40，曝光小幅降低'];
let sel = 0, fav = new Set([0]), favP = new Set(['电影感']), steps = [], history = [], mode = 'pair', ask = true;

const $ = s => document.querySelector(s);
function toast(t){ const b=$('#toastbox'); b.textContent=t; clearTimeout(toast.t); toast.t=setTimeout(()=>b.textContent='',6000); }

/* ---- left tabs ---- */
let ltab = 'preset';
function renderLeft(){
  const p = $('#lpane'); p.innerHTML = '';
  if (ltab==='preset') PRESETS.forEach(x=>{
    const d=document.createElement('div'); d.className='list-item';
    d.innerHTML=`<span class="name">${x}</span><span class="star ${favP.has(x)?'on':''}">★</span>`;
    d.querySelector('.star').onclick=e=>{e.stopPropagation(); favP.has(x)?favP.delete(x):favP.add(x); renderLeft();};
    d.onclick=()=>toast('应用预设「'+x+'」：功能开发中'); p.appendChild(d); });
  if (ltab==='fav'){ const l=[...PHOTOS.filter((_,i)=>fav.has(i)).map(x=>'照片 · '+x.n), ...[...favP].map(x=>'预设 · '+x)];
    if(!l.length) p.innerHTML='<div class="empty">暂无收藏。点击 ★ 添加收藏。</div>';
    l.forEach(x=>{const d=document.createElement('div'); d.className='list-item'; d.innerHTML=`<span class="name">${x}</span>`; p.appendChild(d);}); }
  if (ltab==='exp') { EXPERIENCE.forEach(x=>{const d=document.createElement('div'); d.className='list-item'; d.innerHTML=`<span class="name">${x}</span>`; p.appendChild(d);});
    p.insertAdjacentHTML('beforeend','<div class="empty">经验仅保存在本机，由 AI 记录。</div>'); }
}
$('#ltabs').onclick = e => { const t=e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('#ltabs .tab').forEach(x=>x.classList.toggle('on',x===t)); ltab=t.dataset.t; renderLeft(); };

/* ---- files ---- */
function renderFilesReal(){   // 真实模式：上方显示 Lightroom 当前选中的照片，下方是软件文件夹的只读目录
  const box=$('#files'), p=pv&&pv.photo, ok=pv&&pv.state==='ok', key=(p&&p.name||'')+'|'+(ok?pv.current.url:'');
  $('#libwrap').style.display='flex'; $('#newcat').style.display='none';
  if (box.dataset.k===key) return; box.dataset.k=key;
  box.innerHTML = '<div class="folder" style="margin-top:0">当前选中</div>' + ((p&&p.name) ? `<div class="list-item" style="background:var(--panel2);border-color:var(--accent)">${ok?`<img class="thumb" style="object-fit:cover" src="${esc(pv.current.url)}" alt="">`:'<div class="thumb" style="background:var(--bg)"></div>'}<span class="name">${esc(p.name)}</span></div>` : '<div class="empty">Lightroom 中未选中照片</div>');
}
function renderFiles(){
  if (REAL()) return renderFilesReal();
  $('#libwrap').style.display='none'; $('#newcat').style.display='';
  const box=$('#files'); box.innerHTML=''; box.dataset.k=''; let last='';
  PHOTOS.forEach((p,i)=>{
    if(p.f!==last){ last=p.f; box.insertAdjacentHTML('beforeend',`<div class="folder">📁 ${p.f}</div>`); }
    const d=document.createElement('div'); d.className='list-item'; if(i===sel) d.style.background='var(--panel2)', d.style.borderColor='var(--accent)';
    d.innerHTML=`<div class="thumb" style="background:linear-gradient(160deg,${p.c},#2b3138)"></div><span class="name">${p.n}</span><span class="star ${fav.has(i)?'on':''}">★</span>`;
    d.querySelector('.star').onclick=e=>{e.stopPropagation(); fav.has(i)?fav.delete(i):fav.add(i); renderFiles(); if(ltab==='fav') renderLeft();};
    d.onclick=()=>{ sel=i; steps=[]; history=[]; renderAll(); };
    box.appendChild(d); });
}

/* ---- center ---- */
function nApplied(){ return REAL() ? rows.filter(r=>r.status==='已应用').length : steps.length; }
const DEMO = location.hash === '#demo';
let pv = null, actual = false, noBackend = false;   // pv = 后端推送的最近一次预览内容
const PH_INITIAL = '初始（首次打开时）';
const PH_INITIAL_TIP = '软件第一次读取该照片时的状态。若照片此前已在 Lightroom 中调整过，则不等同于原片。';
function fmtInfo(p){ return [p.name,p.camera,p.iso,p.aperture,p.shutter,p.focal,p.format,p.size].filter(x=>x).join('  ·  '); }
function frameHTML(id, label, tip){ return `<div class="frame" id="${id}"><div class="scroller"><img class="pimg" alt=""></div><div class="ph"></div><span class="label" ${tip?`title="${esc(tip)}"`:''}>${label}</span><span class="chip">正在读取预览</span><span class="note"></span></div>`; }
function setFrame(id, o){   // o: {url, text, note, busy}
  const f=$('#'+id), img=f.querySelector('.pimg');
  if (o.url){ if (img.getAttribute('src')!==o.url) img.src=o.url; f.classList.add('has'); }
  else { img.removeAttribute('src'); f.classList.remove('has'); f.querySelector('.ph').textContent=o.text||''; }
  f.classList.toggle('busy', !!o.busy); f.querySelector('.note').textContent=o.note||'';
}
function renderStage(){
  const s=$('#stage'), real=REAL(), kind = real ? 'real' : (DEMO ? 'demo' : 'none');
  s.classList.toggle('actual', actual && real);
  if (s.dataset.kind!==kind){
    s.dataset.kind=kind;
    if (kind==='demo') s.innerHTML=`<div class="frame has"><div class="scene"></div><span class="label">初始（示例）</span></div><div class="frame has"><div class="scene"></div><span class="label">当前（示例）</span><span class="note"></span></div>`;
    else { s.innerHTML=frameHTML('fi',PH_INITIAL,PH_INITIAL_TIP)+frameHTML('fc','当前'); s.ondblclick=toggleZoom; }
  }
  $('#pvctl').style.display = real ? 'flex' : 'none';
  if (real) renderFilesReal();
  if (kind==='demo'){ $('#cur').textContent='界面演示 · 示例画面，非真实照片';
    s.children[1].querySelector('.scene').classList.toggle('after', !!nApplied());
    s.children[1].querySelector('.note').textContent = nApplied()?'已调整 '+nApplied()+' 项':'暂无调整'; $('#infobar').innerHTML=''; return; }
  if (kind==='none'){ $('#cur').textContent='';
    const t = noBackend ? '当前为静态页面，无预览（地址后加 #demo 可查看界面演示）' : '正在读取预览';
    setFrame('fi',{text:t}); setFrame('fc',{text:t}); $('#infobar').innerHTML=''; return; }
  const p = pv || {state:'loading', message:'正在读取预览'}, ph = p.photo || {};
  $('#cur').textContent = ph.name || photoName || '';
  if (p.state==='ok'){
    const n = nApplied(), pi = p.current;
    setFrame('fi',{url:p.initial.url});
    setFrame('fc',{url:p.current.url, busy:!!p.loading, note: p.same ? (n?'':'与初始一致') : (n?'已调整 '+n+' 项':'')});
    $('#infobar').innerHTML = `<div class="line">${esc(fmtInfo(ph))}</div><div>预览 ${pi.w&&pi.h?pi.w+' × '+pi.h+' 像素':''}${actual?'（100% 显示）':''}。“初始”指软件首次读取该照片时的状态；若此前已在 Lightroom 中调整过，则不等同于原片。</div>`;
  } else {
    const t = p.message || '正在读取预览';
    setFrame('fi',{text:t}); setFrame('fc',{text:t});
    $('#infobar').innerHTML = ph.name ? `<div class="line">${esc(fmtInfo(ph))}</div>` : '';
  }
}
function toggleZoom(){ if(!REAL()) return; actual=!actual; $('#zoom').textContent = actual ? '100%' : '适合窗口'; renderStage(); }
$('#zoom').onclick=toggleZoom;
$('#edge').onchange=()=>{ if(REAL()) window.pywebview.api.set_preview_edge(parseInt($('#edge').value,10)); };
setTimeout(()=>{ if(!REAL()){ noBackend=true; renderStage(); } }, 2500);

/* ---- right ---- */
let rows = [];   // 真实模式下的“本次调整”（由后端推送）
const STCLS = {'已应用':'st-ok','失败':'st-bad','已拒绝':'st-bad','待确认':'st-wait','处理中':'st-wait','已撤销':'st-mute'};
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function renderParams(){
  const tb=$('#ptable tbody'); tb.innerHTML='';
  if (REAL()){
    rows.forEach(r=>{ const can = r.status==='已应用' && r.edit_id;
      tb.insertAdjacentHTML('beforeend',
        `<tr><td>${esc(r.label)}<div class="why">${esc(r.reason)}</div></td><td class="num">${esc(r.before)}</td><td class="num">${esc(r.after)}</td><td class="${STCLS[r.status]||''}">${esc(r.status)}</td><td>${can?`<button class="btn small" data-eid="${esc(r.edit_id)}">撤销</button>`:''}</td></tr>`); });
    tb.querySelectorAll('button[data-eid]').forEach(b=>b.onclick=()=>undoRow(b.dataset.eid));
    $('#pempty').style.display = rows.length?'none':'block';
    $('#restorerow').style.display = rows.some(r=>r.status==='已应用')?'block':'none';
    return;
  }
  steps.forEach(s=>{ tb.insertAdjacentHTML('beforeend',
    `<tr><td>${s.k}<div class="why">${s.why}</div></td><td class="num">${s.a}</td><td class="num ${s.b>s.a?'up':'down'}">${s.b}</td><td class="st-ok">已应用</td><td><button class="btn small" onclick="undoOne('${s.k}')">撤销</button></td></tr>`); });
  $('#pempty').style.display = steps.length?'none':'block';
}
function say(t, who='ai'){ const m=document.createElement('div'); m.className='msg '+who; m.textContent=t; $('#msgs').appendChild(m); m.scrollIntoView(); return m; }

const PLAN = [
  {k:'高光', a:0, b:-35, why:'天空高光区域过亮，降低以保留云层层次'},
  {k:'蓝色饱和度', a:0, b:18, why:'增强天空蓝色'},
  {k:'清晰度', a:0, b:12, why:'提升山体轮廓清晰度'}
];
function apply(s){ steps.push(s); renderParams(); renderStage(); }
function runPlan(i=0){
  if(i>=PLAN.length){ say('调整已完成。可在「本次调整」中逐项撤销。'); return; }
  const s=PLAN[i];
  if(!ask){ apply(s); setTimeout(()=>runPlan(i+1),500); return; }
  const m=document.createElement('div'); m.className='ask';
  m.innerHTML=`拟调整：${s.k} ${s.a} → ${s.b}<div class="why">依据：${s.why}</div><div class="row"><button class="btn primary small">同意</button><button class="btn small">拒绝</button></div>`;
  $('#msgs').appendChild(m); m.scrollIntoView();
  const [ok,no]=m.querySelectorAll('button');
  ok.onclick=()=>{ m.querySelector('.row').remove(); apply(s); runPlan(i+1); };
  no.onclick=()=>{ m.querySelector('.row').remove(); m.append('已拒绝'); runPlan(i+1); };
}
const REAL = () => !!(window.pywebview && window.pywebview.api && window.pywebview.api.send);
let cur = null, busy = false;
let confirmDefault = true;   // 设置里的“逐项确认默认值”，新对话开始时套用   // cur = 正在流式显示的那条 AI 消息
let photoName = null;           // 真实模式：Lightroom 当前选中的照片
const DOTCLR = {connected:'var(--ok)', connecting:'var(--warn)', disconnected:'var(--bad)'};
function showStatus(s){ $('#lrstat').textContent = s.text; $('#lrdot').style.background = DOTCLR[s.state]||'var(--bad)';
  $('#lrhint').textContent = s.state==='connected' ? '' : s.hint; $('#lrhint').title = s.hint; }
function setBusy(b){ busy=b; $('#send').disabled=b; $('#inp').disabled=b; $('#stop').style.display=b?'':'none'; $('#newchat').disabled=b; }
async function newChat(){
  if (!REAL() || busy) return;
  if (!await askDialog('新对话', '将清空当前对话与「本次调整」表格并重置助手会话。照片上已应用的调整不会被撤销，仍可用「还原到原始状态」还原。是否继续？', '新对话')) return;
  await window.pywebview.api.reset();
  $('#msgs').innerHTML=''; rows=[]; cur=null; setAsk(confirmDefault); say('请选择照片并输入期望的修图效果。'); renderParams(); renderStage(); toast('已开始新对话');
}
function note(t){ const n=document.createElement('div'); n.className='note'; n.textContent=t; $('#msgs').appendChild(n); n.scrollIntoView(); return n; }
function fmtCost(c){ return (c==null) ? '' : '，估算费用 $'+Number(c).toFixed(3); }
/* 后端（Python）把每个事件推到这里 */
function showConfirm(ev){
  const m=document.createElement('div'); m.className='ask'; m.id='cf_'+ev.id;
  const items = ev.items.length ? ev.items.map(i=>`<div>${esc(i.label)}：${esc(i.from)} → ${esc(i.to)}</div>`).join('') : '';
  m.innerHTML=`${esc(ev.title)}${items?'':'：'+esc(ev.reason)}<div class="items">${items}</div>${items&&ev.reason?`<div class="why">依据：${esc(ev.reason)}</div>`:''}<div class="row"><button class="btn primary small">同意</button><button class="btn small">拒绝</button></div>`;
  $('#msgs').appendChild(m); m.scrollIntoView();
  const [ok,no]=m.querySelectorAll('button');
  ok.onclick=()=>{ m.querySelector('.row').innerHTML='已提交：同意'; window.pywebview.api.answer(ev.id,true); };
  no.onclick=()=>{ m.querySelector('.row').innerHTML='已提交：拒绝'; window.pywebview.api.answer(ev.id,false); };
}
function closeConfirm(ev){ const m=document.getElementById('cf_'+ev.id); if(!m) return; m.classList.add('done');
  m.querySelector('.row').innerHTML = ev.allow ? '已同意' : (ev.message && ev.message.indexOf('超过')>=0 ? '确认超时，已视为拒绝' : '已拒绝'); }
window.onClaudeEvent = function(ev){
  if (ev.type==='text'){ if(!cur) cur=say('', 'ai'); cur.textContent+=ev.text; cur.scrollIntoView(); }
  else if (ev.type==='tool'){ cur=null; note(ev.label); }
  else if (ev.type==='error'){ cur=null; say(ev.message,'err'); }
  else if (ev.type==='adjust'){ rows=ev.rows; renderParams(); renderStage(); }
  else if (ev.type==='status'){ showStatus(ev); }
  else if (ev.type==='photo'){ photoName=ev.name; renderStage(); }
  else if (ev.type==='preview'){ pv=ev; renderStage(); }
  else if (ev.type==='connecting'){ cur=null; note(ev.message); }
  else if (ev.type==='confirm'){ cur=null; showConfirm(ev); }
  else if (ev.type==='confirm_done'){ closeConfirm(ev); }
  else if (ev.type==='stopped'){ cur=null; note('已停止'); }
  else if (ev.type && ev.type.indexOf('import_')===0){ onImportEvent(ev); }
  else if (ev.type && ev.type.indexOf('export_')===0){ onExportEvent(ev); }
  else if (ev.type==='done'){
    if (!cur && ev.text && !ev.is_error && !$('#msgs').lastChild.classList.contains('ai')) say(ev.text,'ai');
    cur=null; setBusy(false);
    if (ev.tokens) note('本次用量约 '+ev.tokens.toLocaleString()+' token'+fmtCost(ev.cost)+'（估算值，非实际账单）');
  }
};
function send(){ const v=$('#inp').value.trim(); if(!v || busy) return; $('#inp').value=''; say(v,'me');
  if (REAL()){
    setBusy(true); cur=null; note('正在处理请求');
    window.pywebview.api.send(v, ask).then(r=>{ if(r && !r.ok){ say(r.message,'err'); setBusy(false); } })
      .catch(()=>{ say('无法连接后台，请重新启动程序。','err'); setBusy(false); });
    return;
  }
  setTimeout(()=>{ say('已收到需求，正在分析照片并制定调整方案。（演示回复）'); setTimeout(()=>runPlan(0),500); },400); }
$('#stop').onclick=()=>{ if(REAL()) window.pywebview.api.stop(); };
$('#send').onclick=send; $('#inp').onkeydown=e=>{ if(e.key==='Enter') send(); };
function setAsk(v){ ask=!!v; $('#sw').classList.toggle('on',ask);
  $('#swlabel').textContent= ask?'逐项确认：开（每项调整需先确认）':'逐项确认：关（自动执行）'; }
$('#sw').onclick=()=>setAsk(!ask);

/* 弹窗：返回 Promise<boolean> */
function askDialog(title, text, okLabel){ return new Promise(res=>{
  const mk=document.createElement('div'); mk.className='mask show';
  mk.innerHTML=`<div class="dialog small"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row"><button class="btn">取消</button><button class="btn primary">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(mk); const [c,o]=mk.querySelectorAll('button');
  c.onclick=()=>{ mk.remove(); res(false); }; o.onclick=()=>{ mk.remove(); res(true); }; }); }
async function undoRow(eid, force=false){
  const r = await window.pywebview.api.undo(eid, force);
  if (r.ok) return toast('已撤销');
  if (r.conflict && !force){
    if (await askDialog('参数在调整后又发生变化', r.message+'\n\n强制撤销将覆盖这些后续改动。', '强制撤销')) return undoRow(eid, true);
    return;
  }
  toast('撤销失败：'+r.message);
}
async function restoreOriginal(force=false){
  if (!force && !await askDialog('还原到原始状态', '将当前照片还原到首次调整之前的状态，已应用的调整均会被撤销。是否继续？', '还原')) return;
  const r = await window.pywebview.api.restore_original(force);
  if (r.ok) return toast('已还原到原始状态');
  if (r.conflict && !force){
    if (await askDialog('参数在调整后又发生变化', r.message+'\n\n强制还原将覆盖这些后续改动。', '强制还原')) return restoreOriginal(true);
    return;
  }
  toast('还原失败：'+r.message);
}
function undoOne(k){ steps=steps.filter(s=>s.k!==k); renderParams(); renderStage(); toast('已撤销「'+k+'」'); }
function undo(){
  if (REAL()){ const last=[...rows].reverse().find(r=>r.status==='已应用'&&r.edit_id); if(!last) return toast('没有可撤销的调整'); return undoRow(last.edit_id); }
  if(!steps.length) return toast('没有可撤销的调整'); const s=steps.pop(); renderParams(); renderStage(); toast('已撤销「'+s.k+'」'); }

/* ---- export dialog ---- */
let EX = {st:null, o:null, stage:null};
const EX_SIZES = [0, 4096, 2048, 1024];
function exOpen(){ $('#mask').classList.add('show'); }
function exClose(){ $('#mask').classList.remove('show'); EX.stage=null; }
function exSet(body, buttons){
  $('#ex_body').innerHTML=body; const f=$('#ex_foot'); f.innerHTML='';
  (buttons||[]).forEach(b=>{ const e=document.createElement('button'); e.className='btn '+(b.cls||''); e.textContent=b.label; e.disabled=!!b.disabled; if(b.id) e.id=b.id; e.onclick=b.onclick; f.appendChild(e); });
}
async function openExport(){
  if (!REAL()) return toast('界面演示中，导出不可用');
  exOpen(); EX.stage='load';
  exSet('<div class="mute"><span class="spin"></span>正在读取 Lightroom 中选中的照片…</div>', [{label:'取消', onclick:exClose}]);
  let cur = null;
  try { cur = await window.pywebview.api.export_state(); } catch(e){}
  if (cur && cur.stage==='running'){ EX.stage='run'; exRunning(); return; }
  if (cur && cur.stage==='done' && cur.result){ exResult(cur.result); return; }
  try { EX.st = await window.pywebview.api.export_dialog_state(); }
  catch(e){ exSet('<div class="bad">无法读取导出信息，请重试。</div>', [{label:'关闭', onclick:exClose}]); return; }
  EX.o = Object.assign({}, EX.st.options); EX.stage='form'; exForm();
}
function exInfoLine(p){ return [p.camera, p.format, p.size].filter(Boolean).join(' · ') || '—'; }
function exForm(){

    <div class="erow"><span class="lab">保存位置</span>

      <span class="sub" id="ex_dirmsg"></span></div>
    <div class="erow"><label class="lab" for="ex_fmt">格式</label><select id="ex_fmt"><option value="jpeg">JPEG</option><option value="tiff">TIFF</option></select></div>
    <div class="erow" id="ex_qrow"><label class="lab" for="ex_q">质量</label><span class="inline"><input type="range" id="ex_q" min="40" max="100" step="1"><span id="ex_qv" style="width:28px;text-align:right"></span></span>
      <span class="sub">数值越大画质越好，文件越大。</span></div>
    <div class="erow" id="ex_brow"><span class="lab">位深</span><span><label class="radio"><input type="radio" name="ex_bd" value="16"> 16 位</label><label class="radio"><input type="radio" name="ex_bd" value="8"> 8 位</label></span>
      <span class="sub">无损压缩，文件较大。</span></div>

      <span class="sub" id="ex_mdsub"></span></div>
    <div class="sep"></div>
    <div class="erow"><span class="lab">文件名</span><span class="fname" id="ex_name"></span><span class="sub">若同名文件已存在，将自动改名（_2、_3…），不会覆盖。</span></div>
    <div class="bad" id="ex_err"></div>`,
    [{label:'取消', onclick:exClose}, {label:'导出', cls:'primary', id:'ex_go', onclick:exStart}]);
  $('#ex_fmt').value=o.format; $('#ex_q').value=o.quality; $('#ex_md').value=o.metadata; $('#ex_size').value=sizeSel;
  $('#ex_custom').value = sizeSel==='custom' ? o.size : '';
  document.querySelectorAll('input[name=ex_bd]').forEach(r=>{ r.checked = Number(r.value)===o.bit_depth; r.onchange=()=>{ o.bit_depth=Number(r.value); exUpdate(); }; });
  $('#ex_fmt').onchange=()=>{ o.format=$('#ex_fmt').value; exUpdate(); };
  $('#ex_q').oninput=()=>{ o.quality=Number($('#ex_q').value); exUpdate(); };

  $('#ex_custom').oninput=()=>{ const t=$('#ex_custom').value.trim(); o.size = /^\d+$/.test(t) ? Number(t) : -1; exUpdate(); };

function exSizeOk(o){ return o.size===0 || (Number.isInteger(o.size) && o.size>=256 && o.size<=20000); }
function exName(){
  if (!EX.st.photo) return '—';
  const nm = (EX.st.photo && EX.st.photo.name) || 'photo', o=EX.o;
  const stem = nm.replace(/\\/g,'/').split('/').pop().replace(/\.[^.]*$/,'').replace(/[^A-Za-z0-9\-_]/g,'_') || 'photo';
  return stem+'_LrMCP_'+(o.size>0 && exSizeOk(o) ? o.size+'px' : 'full')+'.'+(o.format==='tiff'?'tif':'jpg');
}
function exUpdate(){
  const st=EX.st, o=EX.o, tiff=o.format==='tiff', custom=$('#ex_size').value==='custom';
  $('#ex_qrow').style.display = tiff?'none':''; $('#ex_brow').style.display = tiff?'':'none';
  $('#ex_qv').textContent=o.quality; $('#ex_cwrap').style.display = custom?'':'none'; $('#ex_csub').style.display = custom?'':'none';
  const bad = !exSizeOk(o);
  $('#ex_csub').style.color = bad ? 'var(--bad)' : '';
  $('#ex_big').textContent = (tiff && o.bit_depth===16 && o.size===0) ? '文件可能超过 100 MB。' : '';
  $('#ex_mdsub').textContent = o.metadata==='all' ? '包含拍摄信息，可能含拍摄位置；分享前请留意。' : '仅保留色彩与方向等必要信息，不含拍摄位置。';
  $('#ex_name').textContent = exName();
  $('#ex_dirmsg').textContent = st.folder ? '' : (st.folder_message || '请选择保存位置。');
  $('#ex_dirmsg').style.color = '';

  $('#ex_go').disabled = !(st.photo && st.folder && !bad);
}
async function exPick(){
  const r = await window.pywebview.api.choose_export_folder();
  if (r.ok){ EX.st.folder=r.folder; EX.st.folder_message=''; $('#ex_dir').value=r.folder; }
  exUpdate();
  if (!r.ok && r.message){ $('#ex_dirmsg').textContent=r.message; $('#ex_dirmsg').style.color='var(--bad)'; }
}
async function exStart(){
  const o=EX.o;
  const payload = {format:o.format, size:o.size, quality:o.quality, bit_depth:o.bit_depth, metadata:o.metadata};
  $('#ex_go').disabled=true;

function exRunning(){
  exOpen(); exSet('<div class="big"><span class="spin"></span>正在导出…</div><div class="mute">Lightroom 导出通常需要数秒到数十秒，请稍候。导出期间请勿关闭软件。</div>',
    [{label:'取消', disabled:true}, {label:'导出', cls:'primary', disabled:true}]);
}
function exResult(ev){
  EX.stage='done'; exOpen();

  if (ev.status==='exported'){
    const bd = ev.format==='tiff' && ev.bit_depth ? `（${ev.bit_depth} 位）` : '';
    exSet(`<div class="big okmsg">导出完成。</div>
      <div class="kvl"><span>文件名</span><span>${esc(ev.file)}</span><span>格式</span><span>${esc(ev.format_label)}${bd}</span>
        <span>尺寸</span><span>${esc(ev.dimensions||'—')}</span><span>文件大小</span><span>${esc(ev.size_text)}</span>
        <span>保存位置</span><span>${esc(ev.folder)}</span></div>`,
      [{label:'在资源管理器中显示', onclick:async()=>{ const r=await window.pywebview.api.reveal_last_export(); if(!r.ok) toast(r.message); }}, close]);
  } else if (ev.status==='uncertain'){
    exSet(`<div class="big">状态不确定</div><div class="warn" style="color:var(--warn)">${esc(ev.message)}</div><div class="kvl"><span>保存位置</span><span>${esc(ev.folder)}</span></div>`, [close]);
  } else {
    exSet(`<div class="big">导出失败</div><div class="bad">${esc(ev.message)}</div>`,

function onExportEvent(ev){
  if (ev.type==='export_done'){ if ($('#mask').classList.contains('show')) exResult(ev); else toast('导出已结束，请点击“导出”查看结果。'); }

$('#mask').onclick=e=>{ if(e.target.id==='mask' && (EX.stage==='form'||EX.stage==='load')) exClose(); };


/* ---- import ---- */
let IM = {cat:'', stage:null, pstage:null};
const fmtSize = n => n>=1073741824 ? (n/1073741824).toFixed(2)+' GB' : n>=1048576 ? (n/1048576).toFixed(1)+' MB' : n>=1024 ? (n/1024).toFixed(1)+' KB' : n+' B';
const fmtTime = s => { s=Math.round(s||0); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
function imOpen(title){ $('#im_title').textContent=title; $('#imask').classList.add('show'); }
function imClose(){ $('#imask').classList.remove('show'); IM.stage=null; IM.pstage=null; }
function imSet(body, buttons){   // buttons: [{label, cls, onclick, disabled, id}]
  $('#im_body').innerHTML=body; const f=$('#im_foot'); f.innerHTML='';
  (buttons||[]).forEach(b=>{ const e=document.createElement('button'); e.className='btn '+(b.cls||''); e.textContent=b.label; e.disabled=!!b.disabled; if(b.id) e.id=b.id; e.onclick=b.onclick; f.appendChild(e); });
}
function infoDialog(title, text){ return askDialog(title, text, '知道了'); }
async function startImport(){
  if (!REAL()) return toast('界面演示中，导入不可用');
  if (IM.stage) { $('#imask').classList.add('show'); return; }
  IM.cat=''; IM.stage='scanning';      // 先置状态：扫描很快结束时，完成事件可能先于本函数返回
  const r = await window.pywebview.api.choose_source_folder();
  if (!r.ok){ IM.stage=null; if (r.message) await infoDialog('无法导入', r.message); return; }
  if (IM.stage==='scanning') imScanning(0);
}
function imScanning(n){
  imOpen('导入照片');
  imSet(`<div class="big">正在扫描来源文件夹</div><div class="mute">已找到 ${n} 张照片。扫描只读取文件名，不会改动存储卡上的任何内容。</div>`,
    [{label:'取消', onclick:async()=>{ await window.pywebview.api.import_cancel(); imClose(); }}]);
}
async function imConfirm(){
  IM.stage='confirm'; imOpen('导入照片');
  const cur = $('#im_cat') ? $('#im_cat').value : IM.cat;
  const p = await window.pywebview.api.import_prepare(cur);
  if (!p.found){ imSet(`<div class="bad">${esc((p.errors&&p.errors._)||'没有可导入的内容。')}</div>`, [{label:'关闭', onclick:async()=>{ await window.pywebview.api.import_close(); imClose(); }}]); return; }
  const f=p.found, errs=Object.entries(p.errors||{});
  const errHTML = errs.filter(([k])=>k!=='category').map(([,m])=>`<div class="bad">${esc(m)}</div>`).join('');
  const catErr = (p.errors&&p.errors.category) ? `<div class="bad">${esc(p.errors.category)}</div>` : '';
  const notes = [];
  notes.push('<div class="mute">原片仅被读取，不会移动、删除或修改；照片复制到软件文件夹后再加入 Lightroom 目录。同名且大小相同的文件视为已导入并跳过，不会覆盖已有文件。</div>');
  if (!p.lr_connected) notes.push('<div class="warn">Lightroom 当前未连接：将只复制照片，稍后可在结果页选择“重新尝试加入 Lightroom”。</div>');
  if (!p.base_exists && !(p.errors&&p.errors.base)) notes.push('<div class="warn">软件文件夹尚不存在，开始导入时将询问是否创建。</div>');
  if (f.skipped_links) notes.push(`<div class="mute">已忽略 ${f.skipped_links} 个快捷方式或链接。</div>`);
  imSet(`<div class="big">找到 ${f.n} 张（RAW ${f.raw}、JPEG ${f.jpeg}、其他 ${f.other}），共 ${esc(f.size_text)}</div>
    <div class="kvl"><span>来源文件夹</span><span>${esc(p.source)}</span>
      <span>软件文件夹</span><span>${esc(p.base)}${p.base_is_default?'（默认位置，可在设置中更换）':''}</span>
      <span>分类文件夹名</span><span><input type="text" id="im_cat" maxlength="60" placeholder="可选，留空则直接放入软件文件夹" value="${esc(cur)}"></span>
      <span>保存到</span><span>${esc(p.target)}</span>
      <span>磁盘剩余空间</span><span>${esc(p.free_text)}（本次需要约 ${esc(p.needed_text)}）</span></div>${catErr}${errHTML}${notes.join('')}`,
    [{label:'取消', onclick:async()=>{ await window.pywebview.api.import_cancel(); imClose(); }},
     {label:'开始导入', cls:'primary', id:'im_go', disabled:!p.can_start, onclick:imBegin}]);
  const inp=$('#im_cat'); let t=null;
  inp.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ IM.cat=inp.value; imConfirm().then(()=>{ const i=$('#im_cat'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }); },350); };
}
async function imBegin(){
  const cat=$('#im_cat').value; IM.cat=cat;
  let r = await window.pywebview.api.import_start(cat, false);
  if (r.needs_create){
    if (!await askDialog('创建文件夹', '软件文件夹不存在：\n'+r.base+'\n是否创建？', '创建')) return;
    r = await window.pywebview.api.import_start(cat, true);
  }
  if (!r.ok){ await infoDialog('无法开始导入', r.message||'无法开始导入。'); imConfirm(); return; }
  IM.stage='copying'; IM.pstage=null;
  imProgress({i:0,n:0,name:'',elapsed:0,counts:{copied:0,skipped:0,failed:0,lr_ok:0,lr_uncertain:0,lr_pending:0,lr_failed:0}});
}
function countsLine(c){ return `已复制 ${c.copied}　跳过 ${c.skipped}　失败 ${c.failed}　已加入 Lightroom ${c.lr_ok}`+(c.lr_uncertain?`　需确认 ${c.lr_uncertain}`:'')+(c.lr_pending?`　尚未加入 ${c.lr_pending}`:'')+(c.lr_failed?`　加入失败 ${c.lr_failed}`:''); }
function imProgress(ev){
  if (IM.stage!=='copying' && IM.stage!=='retry') IM.stage='copying';
  imOpen(ev.mode==='retry'?'重新加入 Lightroom':'正在导入');
  const n=ev.n||0, i=Math.min(ev.i+1,n), pct = n? Math.round(ev.i/n*100):0;
  if ($('#im_bar') && IM.pstage==='on'){ $('#im_bar').style.width=pct+'%'; $('#im_line').textContent = n?`第 ${i}/${n} 个　${ev.name||''}`:'准备中'; $('#im_time').textContent='已用时 '+fmtTime(ev.elapsed); $('#im_counts').textContent=countsLine(ev.counts); return; }
  IM.pstage='on';
  imSet(`<div class="big" id="im_line">${n?`第 ${i}/${n} 个　${esc(ev.name||'')}`:'准备中'}</div><div class="bar"><i id="im_bar" style="width:${pct}%"></i></div>
    <div class="mute" id="im_time">已用时 ${fmtTime(ev.elapsed)}</div><div class="mute" id="im_counts">${esc(countsLine(ev.counts))}</div>
    <div class="mute">取消后将在当前照片处理完成后停止，已完成的保留。</div>`,
    [{label:'取消导入', onclick:async(e)=>{ e.target.disabled=true; e.target.textContent='正在停止'; await window.pywebview.api.import_cancel(); }}]);
}
function imResult(ev){
  IM.stage='done'; IM.pstage=null; imOpen('导入结果'); const c=ev.counts;
  const rows = (ev.problems||[]).map(p=>{ const what = p.copy==='failed' ? '复制' : '加入 Lightroom';
    return `<tr><td>${esc(p.name)}</td><td>${what}</td><td>${p.lr==='uncertain'?'请在 Lightroom 中确认：':''}${esc(p.reason||'')}</td></tr>`; }).join('');
  const lines = [];
  if (ev.cancelled) lines.push('<div class="warn">已取消。已完成的照片保留，未处理的没有复制。</div>');
  if (c.lr_pending) lines.push(`<div class="warn">有 ${c.lr_pending} 张已复制但尚未加入 Lightroom。</div>`);
  if (c.lr_uncertain) lines.push(`<div class="warn">有 ${c.lr_uncertain} 张需要在 Lightroom 中确认是否已加入（软件不会自动重试，以免重复添加）。</div>`);
  if (!ev.cancelled && !c.failed && !c.lr_pending && !c.lr_uncertain && !c.lr_failed) lines.push('<div class="okmsg">全部完成。</div>');
  imSet(`<div class="big">${esc(countsLine(c))}</div><div class="mute">共 ${ev.n} 张，用时 ${fmtTime(ev.elapsed)}。</div>${lines.join('')}
    ${rows?`<div class="plist"><table><thead><tr><th>文件</th><th>环节</th><th>原因</th></tr></thead><tbody>${rows}</tbody></table>${ev.problems_more?`<div class="mute">另有 ${ev.problems_more} 项未列出。</div>`:''}</div>`:''}`,
    [ev.pending_retry?{label:'重新尝试加入 Lightroom', onclick:async()=>{ const r=await window.pywebview.api.import_retry_lr(); if(!r.ok) await infoDialog('无法重新加入', r.message); else { IM.stage='retry'; IM.pstage=null; } }}:null,
     {label:'关闭', cls:'primary', onclick:async()=>{ await window.pywebview.api.import_close(); imClose(); }}].filter(Boolean));
  loadLibrary();
}
function onImportEvent(ev){
  if (ev.type==='import_scan'){
    if (ev.state==='scanning'){ if(IM.stage==='scanning'){ imScanning(ev.found||0); } }
    else if (ev.state==='done'){ if (ev.error){ imOpen('导入照片'); imSet(`<div class="bad">${esc(ev.error)}</div>`, [{label:'关闭', onclick:async()=>{ await window.pywebview.api.import_close(); imClose(); }}]); } else imConfirm(); }
    else if (ev.state==='cancelled'){ imClose(); }
  } else if (ev.type==='import_progress'){ imProgress(ev); }
  else if (ev.type==='import_done'){ imResult(ev); }
}

/* ---- 软件文件夹（只读目录） ---- */
let LIB = null, libOpen = {}, libSel = null;
async function loadLibrary(){
  if (!REAL()) return;
  try { LIB = await window.pywebview.api.library_list(200); } catch(e){ return; }
  renderLibrary();
}
function renderLibrary(){
  const box=$('#lib'); if(!LIB){ box.innerHTML=''; return; }
  $('#libtitle').textContent='软件文件夹'+(LIB.exists?`（${LIB.total} 张）`:'');
  if (!LIB.exists){ box.innerHTML=`<div class="empty">软件文件夹尚不存在。完成一次导入后会自动创建。</div><div class="empty" style="user-select:text">${esc(LIB.base)}</div>`; return; }
  if (!LIB.total){ box.innerHTML=`<div class="empty">软件文件夹中暂无照片。</div><div class="empty" style="user-select:text">${esc(LIB.base)}</div>`; return; }
  let h='';
  LIB.groups.forEach(g=>{ const open = libOpen[g.name]!==false;
    h+=`<div class="libgrp" data-g="${esc(g.name)}"><span>${open?'▾':'▸'}</span><span>${esc(g.name)}</span><span class="cnt">${g.count}</span></div>`;
    if (open) g.files.forEach(f=>{ h+=`<div class="libfile${libSel&&libSel.g===g.name&&libSel.n===f.name?' on':''}" data-g="${esc(g.name)}" data-n="${esc(f.name)}" data-s="${f.size}"><span>${esc(f.name)}</span><span class="sz">${fmtSize(f.size)}</span></div>`; }); });
  if (LIB.more>0) h+=`<div class="empty">仅显示前 ${LIB.shown} 项，另有 ${LIB.more} 项未显示。</div>`;
  if (libSel) h+=`<div class="libinfo">${esc(libSel.n)} · ${fmtSize(libSel.s)}<br>位置：${esc(libSel.g==='（未分类）'?LIB.base:LIB.base+'\\'+libSel.g)}<br>软件暂不能在 Lightroom 中选中该照片，请在 Lightroom 中选择照片。</div>`;
  box.innerHTML=h;
  box.querySelectorAll('.libgrp').forEach(e=>e.onclick=()=>{ libOpen[e.dataset.g] = libOpen[e.dataset.g]===false; renderLibrary(); });
  box.querySelectorAll('.libfile').forEach(e=>e.onclick=()=>{ libSel={g:e.dataset.g,n:e.dataset.n,s:Number(e.dataset.s)}; renderLibrary(); });
}
$('#libref').onclick=()=>{ libSel=null; loadLibrary(); };
$('#libopen').onclick=async()=>{ const r=await window.pywebview.api.open_library(); if(!r.ok) toast(r.message); };

/* ---- settings dialog ---- */
let SET = null, setConfirm = true;
function setConfirmUI(v){ setConfirm=!!v; $('#s_confirm').classList.toggle('on', setConfirm); $('#s_confirm_t').textContent = setConfirm ? '开' : '关'; }
$('#s_confirm').onclick=()=>setConfirmUI(!setConfirm);
function showProviderState(){

  const st = $('#s_pstate'); st.className = 'sub ' + (p.selectable ? (p.available ? 'ok' : 'bad') : '');

}
$('#s_provider').onchange=showProviderState;
function fillSettings(r){
  SET = r; const s = r.settings;
  $('#s_folder').value = s.base_folder;
  const sel = $('#s_provider'); sel.innerHTML='';
  r.providers.forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.textContent=p.name + (p.selectable?'':'（后续提供）'); o.disabled=!p.selectable; sel.appendChild(o); });
  sel.value = s.provider;
  const ed = $('#s_edge'); ed.innerHTML=''; r.edges.forEach(e=>{ const o=document.createElement('option'); o.value=e; o.textContent='长边 '+e+' px'; ed.appendChild(o); }); ed.value = s.preview_edge;

  const a = r.about;
  $('#a_app').textContent = a.app_version; $('#a_lr').textContent = a.lightroom_version || '未连接，无法读取';
  $('#a_plugin').textContent = a.plugin_version || '未连接，无法读取'; $('#a_data').textContent = a.data_dir; $('#a_url').textContent = a.project_url;
}
function clearSettingsErrors(){ ['folder','provider','edge'].forEach(k=>{ $('#e_'+k).textContent=''; }); $('#s_msg').textContent=''; $('#s_msg').className='msg-line'; }
async function openSettings(){
  if (!REAL()) return;
  clearSettingsErrors(); $('#smask').classList.add('show');
  $('#s_msg').textContent = '正在读取设置…';
  try { fillSettings(await window.pywebview.api.get_settings(true)); $('#s_msg').textContent=''; }
  catch(e){ $('#s_msg').textContent='无法读取设置，请重试。'; $('#s_msg').className='msg-line bad'; }
}
function closeSettings(){ $('#smask').classList.remove('show'); }
$('#s_cancel').onclick=closeSettings;
$('#smask').onclick=e=>{ if(e.target.id==='smask') closeSettings(); };
$('#s_pick').onclick=async()=>{
  const r = await window.pywebview.api.choose_folder($('#s_folder').value);
  if (!r.ok) return;
  $('#s_folder').value = r.path; const v = await window.pywebview.api.check_folder(r.path);
  $('#e_folder').textContent = v.ok ? (v.exists ? '' : '该文件夹尚不存在，保存时将询问是否创建。') : v.message;
  $('#e_folder').style.color = v.ok ? 'var(--muted)' : '';
};
const FIELD_KEYS = {base_folder:'folder', provider:'provider', preview_edge:'edge'};
async function saveSettings(createMissing=false){
  clearSettingsErrors();
  const changes = {base_folder: $('#s_folder').value, provider: $('#s_provider').value,
                   confirm_default: setConfirm, preview_edge: parseInt($('#s_edge').value,10)};
  const r = await window.pywebview.api.save_settings(changes, createMissing);
  if (r.ok){
    SET.settings = r.settings; confirmDefault = r.settings.confirm_default;
    $('#edge').value = String(r.settings.preview_edge);
    closeSettings(); toast('设置已保存'); return;
  }
  if (r.needs_create){
    if (await askDialog('创建文件夹', '文件夹不存在：\n' + $('#s_folder').value + '\n是否创建？', '创建')) return saveSettings(true);
    $('#e_folder').textContent = '文件夹尚未创建，设置未保存。'; return;
  }
  let shown = false;
  Object.entries(r.errors||{}).forEach(([k,m])=>{ const el = $('#e_'+(FIELD_KEYS[k]||'')); if (el){ el.textContent=m; el.style.color=''; shown=true; } });
  const m = $('#s_msg'); m.className='msg-line bad';
  m.textContent = (r.errors && r.errors._) ? r.errors._ : (shown ? '设置未保存，请修正标红项。' : '设置未保存。');
}
$('#s_save').onclick=()=>saveSettings(false);

/* 真实模式：隐藏演示标记，显示 Lightroom 连接状态 */
if (location.hash !== '#demo') window.addEventListener('pywebviewready', ()=>{
  $('#demobadge').style.display='none';
  $('#newchat').style.display=''; $('#setbtn').style.display='';
  window.pywebview.api.get_settings(false).then(r=>{ confirmDefault=r.settings.confirm_default; setAsk(confirmDefault);
    $('#edge').value=String(r.settings.preview_edge); }).catch(()=>{});
  const poll=()=>window.pywebview.api.status().then(s=>{ showStatus(s); if (s.photo && s.photo.name && s.photo.name!==photoName){ photoName=s.photo.name; renderStage(); } }).catch(()=>{});
  window.pywebview.api.preview_state().then(r=>{ pv=r; renderStage(); }).catch(()=>{});
  poll(); setInterval(poll, 3000); renderParams(); renderStage(); loadLibrary();
  window.pywebview.api.import_state().then(st=>{   // 页面重新加载时接续导入界面
    if (st.stage==='scanning'){ IM.stage='scanning'; imScanning(0); }
    else if (st.stage==='ready'){ imConfirm(); }
    else if (st.stage==='copying'&&st.progress){ IM.stage='copying'; imProgress(st.progress); }
    else if (st.stage==='done'&&st.result){ imResult(st.result); } }).catch(()=>{}); });
function renderAll(){ renderLeft(); renderFiles(); renderStage(); renderParams(); }
renderAll();
/* 截图用：地址后加 #demo 会自动演示一轮 */
if (location.hash === '#demo') {
  say('提高天空通透度，增强整体层次感', 'me');
  say('已收到需求，正在分析照片并制定调整方案。（演示回复）');
  runPlan(0);
}
</script>
